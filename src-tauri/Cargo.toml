[package]
name = "collector-to-lazer"
version = "0.1.1"
description = "osu!collector -> osu!lazer downloader with star filter"
authors = ["Xavie"]
license = "MIT"
repository = "https://github.com/X4vi3/osu-collector-lazer"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "collector_to_lazer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = { version = "0.13.1", optional = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate", "unreserved"] }
md-5 = "0.11.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
futures-util = "0.3.34"
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "gzip", "query", "system-proxy"] }
tokio-util = "0.7.20"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
# Debug-only Tauri MCP bridge for UI automation. Enabled by `npm run dev`, never in release builds.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[dev-dependencies]
tempfile = "3.27.0"

